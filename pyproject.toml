[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cashdesk-control"
version = "0.3.0"
description = "Рабочая станция администратора касс Set Retail: SSH, SFTP, VNC, БД и сводный отчёт"
requires-python = ">=3.10"
readme = "README.md"

[project.scripts]
cashdesk-control = "cashdesk_control.main:main"

[project.optional-dependencies]
ssh = ["asyncssh>=2.14"]
secure = ["keyring>=24", "cryptography>=41"]
qt = ["PySide6>=6.6", "qasync>=0.27", "pyte>=0.8"]
db = ["sqlalchemy>=2.0", "psycopg[binary]>=3.1"]
dev = ["pytest>=8"]
build = ["pyinstaller>=6.3"]

[tool.setuptools.packages.find]
include = ["cashdesk_control*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
