name: Windows application

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - arena/01a072a0-test
      - arena/01a07848-test
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64

      - name: Install application and build dependencies
        shell: pwsh
        run: python -m pip install --upgrade ".[qt,ssh,secure,db,build]" pytest

      - name: Run tests
        run: python -m pytest tests -v

      - name: Build onedir executable
        run: python -m PyInstaller --noconfirm --clean packaging/windows/CashdeskControl.spec

      - name: Smoke-check the packaged executable
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\CashdeskControl\CashdeskControl.exe")) {
            throw "CashdeskControl.exe was not created"
          }
          Get-Item "dist\CashdeskControl\CashdeskControl.exe" | Format-List FullName,Length

      - name: Create distributable archive
        shell: pwsh
        run: Compress-Archive -Path "dist\CashdeskControl\*" -DestinationPath "dist\CashdeskControl-windows-x64.zip"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: CashdeskControl-windows-x64
          path: dist/CashdeskControl
          if-no-files-found: error
          retention-days: 14

      # On a v* tag the same build is also attached to the GitHub release, so a
      # push of `git tag v0.3.0` produces a permanent download page.
      - name: Attach archive to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/CashdeskControl-windows-x64.zip
          fail_on_unmatched_files: true
