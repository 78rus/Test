---
# Касса Control — статический интерфейс операционного центра
apiVersion: v1
kind: ConfigMap
metadata:
  name: simple-web-content
data:
  index.html: |
    <!doctype html>
    <html lang="ru">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <meta name="theme-color" content="#0d1016">
      <meta name="description" content="Касса Control — единый операционный центр для удалённого обслуживания кассовых систем.">
      <title>Касса Control — операционный центр</title>
      <link rel="stylesheet" href="styles.css">
    </head>
    <body>
      <div class="app-shell">
        <aside class="sidebar" id="sidebar">
          <div class="brand-row">
            <div class="brand-mark" aria-hidden="true">
              <span></span><span></span><span></span>
            </div>
            <div class="brand-lockup">
              <strong>КАССА</strong>
              <span>CONTROL</span>
            </div>
            <button class="icon-button sidebar-close" id="sidebarClose" type="button" aria-label="Свернуть меню">
              <span class="icon" data-icon="panel-left"></span>
            </button>
          </div>

          <div class="workspace-switcher">
            <div class="workspace-avatar">ОЦ</div>
            <div class="workspace-copy">
              <span>Рабочее пространство</span>
              <strong>Операционный центр</strong>
            </div>
            <span class="icon chevron" data-icon="chevron-down"></span>
          </div>

          <button class="primary-button new-connection" id="newConnection" type="button">
            <span class="icon" data-icon="plus"></span>
            <span>Новое подключение</span>
            <kbd>⌘ N</kbd>
          </button>

          <nav class="main-nav" aria-label="Навигация">
            <p class="eyebrow nav-label">Рабочая область</p>
            <button class="nav-item active" type="button" data-nav="sessions">
              <span class="icon" data-icon="layout-dashboard"></span>
              <span>Все сессии</span>
              <span class="nav-count">4</span>
            </button>
            <button class="nav-item" type="button" data-nav="activity">
              <span class="icon" data-icon="activity"></span>
              <span>Журнал событий</span>
              <span class="live-dot"></span>
            </button>
            <button class="nav-item" type="button" data-nav="connections">
              <span class="icon" data-icon="bookmark"></span>
              <span>Сохранённые профили</span>
            </button>
          </nav>

          <div class="session-list-wrap">
            <div class="section-heading">
              <p class="eyebrow">Активные сессии</p>
              <button class="text-button" id="manageSessions" type="button">Управлять</button>
            </div>
            <div class="session-list" id="sessionList">
              <button class="session-card selected" type="button" data-session="warehouse">
                <span class="session-badge blue">С</span>
                <span class="session-card-copy">
                  <strong>Склад · Терминал 01</strong>
                  <small>10.24.8.41 <span class="session-type">POS</span></small>
                </span>
                <span class="status-dot online"></span>
              </button>
              <button class="session-card" type="button" data-session="cafe">
                <span class="session-badge violet">К</span>
                <span class="session-card-copy">
                  <strong>Кафе · Касса 02</strong>
                  <small>10.24.8.42 <span class="session-type">SCO</span></small>
                </span>
                <span class="status-dot online"></span>
              </button>
              <button class="session-card" type="button" data-session="shop">
                <span class="session-badge amber">М</span>
                <span class="session-card-copy">
                  <strong>Магазин · Линия 03</strong>
                  <small>10.24.8.50 <span class="session-type">Touch</span></small>
                </span>
                <span class="status-dot warning"></span>
              </button>
              <button class="session-card" type="button" data-session="reserve">
                <span class="session-badge slate">Р</span>
                <span class="session-card-copy">
                  <strong>Резерв · Терминал 01</strong>
                  <small>10.24.8.60 <span class="session-type">Hybrid</span></small>
                </span>
                <span class="status-dot offline"></span>
              </button>
            </div>
            <button class="all-sessions" id="showAllSessions" type="button">
              <span class="icon" data-icon="layers"></span>
              <span>Показать все 10 слотов</span>
              <span class="icon arrow-right" data-icon="arrow-right"></span>
            </button>
          </div>

          <div class="sidebar-bottom">
            <div class="secure-status">
              <span class="secure-icon"><span class="icon" data-icon="shield-check"></span></span>
              <span><strong>Хранилище защищено</strong><small>Ключи в системном keyring</small></span>
              <span class="status-dot online"></span>
            </div>
            <button class="profile-button" id="profileButton" type="button">
              <span class="avatar">АК</span>
              <span class="profile-copy"><strong>Алексей К.</strong><small>Инженер поддержки</small></span>
              <span class="icon" data-icon="more-horizontal"></span>
            </button>
          </div>
        </aside>

        <main class="main-content">
          <header class="topbar">
            <div class="breadcrumbs">
              <span>Сессии</span>
              <span class="icon" data-icon="chevron-right"></span>
              <strong id="breadcrumbSession">Склад · Терминал 01</strong>
            </div>
            <div class="topbar-actions">
              <button class="icon-button search-trigger" id="searchTrigger" type="button" aria-label="Поиск" title="Поиск (⌘ K)">
                <span class="icon" data-icon="search"></span>
              </button>
              <button class="icon-button notification-button" id="notificationButton" type="button" aria-label="Уведомления">
                <span class="icon" data-icon="bell"></span><span class="notification-badge">3</span>
              </button>
              <span class="topbar-divider"></span>
              <span class="environment-label"><span class="live-dot"></span> Локальный контур</span>
            </div>
          </header>

          <section class="workspace-header">
            <div class="session-heading">
              <div class="heading-icon blue-bg"><span class="icon" data-icon="store"></span></div>
              <div>
                <div class="title-line">
                  <h1 id="sessionTitle">Склад · Терминал 01</h1>
                  <span class="connection-pill"><span class="status-dot online"></span> Подключено</span>
                </div>
                <div class="session-meta">
                  <span><span class="icon" data-icon="map-pin"></span> Москва, Ленинский пр-т</span>
                  <span class="meta-separator"></span>
                  <span><span class="icon" data-icon="server"></span> <strong id="sessionIp">10.24.8.41</strong></span>
                  <span class="meta-separator"></span>
                  <span id="sessionUptime">В сети 00:42:18</span>
                </div>
              </div>
            </div>
            <div class="workspace-actions">
              <button class="secondary-button" id="refreshSession" type="button">
                <span class="icon" data-icon="refresh-cw"></span>
                <span>Обновить</span>
              </button>
              <button class="primary-button compact" id="openTerminal" type="button">
                <span class="icon" data-icon="terminal-square"></span>
                <span>Открыть терминал</span>
              </button>
              <button class="icon-button more-button" id="moreActions" type="button" aria-label="Дополнительные действия">
                <span class="icon" data-icon="more-horizontal"></span>
              </button>
            </div>
          </section>

          <nav class="module-tabs" id="moduleTabs" aria-label="Модули сессии">
            <button class="module-tab active" type="button" data-tab="overview"><span class="icon" data-icon="grid-2x2"></span>Обзор</button>
            <button class="module-tab" type="button" data-tab="terminal"><span class="icon" data-icon="terminal"></span>Терминал<span class="tab-live"></span></button>
            <button class="module-tab" type="button" data-tab="files"><span class="icon" data-icon="folder-open"></span>Файлы</button>
            <button class="module-tab" type="button" data-tab="database"><span class="icon" data-icon="database"></span>База данных</button>
            <button class="module-tab" type="button" data-tab="vnc"><span class="icon" data-icon="monitor"></span>VNC</button>
            <button class="module-tab" type="button" data-tab="hardware"><span class="icon" data-icon="cpu"></span>Оборудование<span class="tab-alert"></span></button>
          </nav>

          <div class="content-scroll">
            <section class="tab-panel active" data-panel="overview">
              <div class="overview-intro">
                <div>
                  <p class="eyebrow accent-label">Сводка по системе</p>
                  <h2>Всё работает штатно <span class="wave">✦</span></h2>
                  <p class="intro-copy">Последняя проверка завершена сегодня в 14:32. Система готова к работе.</p>
                </div>
                <button class="ghost-button" id="rescanButton" type="button"><span class="icon" data-icon="scan-line"></span> Пересканировать систему</button>
              </div>

              <div class="metrics-grid">
                <article class="metric-card status-card">
                  <div class="metric-top"><span class="metric-label">Состояние кассы</span><span class="metric-icon green"><span class="icon" data-icon="check-circle-2"></span></span></div>
                  <div class="metric-value">Онлайн</div>
                  <div class="metric-foot"><span class="status-dot online"></span> Все сервисы отвечают <span class="metric-time">32 ms</span></div>
                </article>
                <article class="metric-card cpu-card">
                  <div class="metric-top"><span class="metric-label">Загрузка CPU</span><span class="metric-icon blue"><span class="icon" data-icon="gauge"></span></span></div>
                  <div class="metric-value">42<span class="metric-unit">%</span></div>
                  <div class="metric-foot"><span class="trend-up"><span class="icon" data-icon="arrow-up-right"></span> 8.4%</span> к прошлому часу <svg class="mini-chart blue-chart" viewBox="0 0 108 30" aria-hidden="true"><path d="M2 24 C12 23 12 18 21 20 S31 26 40 19 S49 14 57 17 S67 14 74 16 S83 8 90 10 S99 4 106 5"/></svg></div>
                </article>
                <article class="metric-card memory-card">
                  <div class="metric-top"><span class="metric-label">Память</span><span class="metric-icon violet"><span class="icon" data-icon="memory-stick"></span></span></div>
                  <div class="metric-value">6.2<span class="metric-unit"> / 16 GB</span></div>
                  <div class="metric-foot"><span class="progress-track small"><span class="progress-fill violet-fill" style="width:39%"></span></span><span>39%</span></div>
                </article>
                <article class="metric-card tunnel-card">
                  <div class="metric-top"><span class="metric-label">SSH-туннели</span><span class="metric-icon amber"><span class="icon" data-icon="waypoints"></span></span></div>
                  <div class="metric-value">3<span class="metric-unit"> активных</span></div>
                  <div class="metric-foot"><span class="status-dot online"></span> 0 ошибок за 24 часа <button class="inline-link" id="viewTunnels" type="button">Настроить</button></div>
                </article>
              </div>

              <div class="dashboard-grid">
                <article class="panel connections-panel">
                  <div class="panel-header">
                    <div><p class="eyebrow">Сервисы сессии</p><h3>Активные подключения</h3></div>
                    <button class="icon-button small" id="connectionMenu" type="button" aria-label="Меню подключений"><span class="icon" data-icon="more-horizontal"></span></button>
                  </div>
                  <div class="service-list">
                    <div class="service-row"><span class="service-icon ssh"><span class="icon" data-icon="terminal"></span></span><span class="service-info"><strong>SSH-консоль</strong><small>OpenSSH 8.9 · порт 22</small></span><span class="latency">28 ms</span><span class="state-chip success">Активно</span><button class="row-arrow" data-open-tab="terminal" type="button" aria-label="Открыть SSH"><span class="icon" data-icon="arrow-up-right"></span></button></div>
                    <div class="service-row"><span class="service-icon sftp"><span class="icon" data-icon="folder-open"></span></span><span class="service-info"><strong>SFTP</strong><small>/opt/cashdesk · чтение и запись</small></span><span class="latency">31 ms</span><span class="state-chip success">Активно</span><button class="row-arrow" data-open-tab="files" type="button" aria-label="Открыть файлы"><span class="icon" data-icon="arrow-up-right"></span></button></div>
                    <div class="service-row"><span class="service-icon db"><span class="icon" data-icon="database"></span></span><span class="service-info"><strong>PostgreSQL</strong><small>cashdesk · через туннель 5432</small></span><span class="latency">35 ms</span><span class="state-chip success">Активно</span><button class="row-arrow" data-open-tab="database" type="button" aria-label="Открыть базу"><span class="icon" data-icon="arrow-up-right"></span></button></div>
                    <div class="service-row"><span class="service-icon vnc"><span class="icon" data-icon="monitor"></span></span><span class="service-info"><strong>Удалённый экран</strong><small>VNC · localhost:5901</small></span><span class="latency">44 ms</span><span class="state-chip neutral">Готов</span><button class="row-arrow" data-open-tab="vnc" type="button" aria-label="Открыть VNC"><span class="icon" data-icon="arrow-up-right"></span></button></div>
                  </div>
                  <button class="panel-link" id="manageConnections" type="button">Управление подключениями <span class="icon" data-icon="arrow-up-right"></span></button>
                </article>

                <article class="panel quick-panel">
                  <div class="panel-header"><div><p class="eyebrow">Инструменты</p><h3>Быстрые действия</h3></div><span class="shortcut-hint">⌘ K</span></div>
                  <div class="quick-actions">
                    <button class="quick-action" data-quick-tab="terminal" type="button"><span class="quick-icon blue"><span class="icon" data-icon="terminal-square"></span></span><span><strong>Открыть терминал</strong><small>SSH-соединение</small></span><span class="icon quick-chevron" data-icon="chevron-right"></span></button>
                    <button class="quick-action" data-quick-tab="files" type="button"><span class="quick-icon violet"><span class="icon" data-icon="file-edit"></span></span><span><strong>Просмотреть конфиги</strong><small>12 файлов изменено</small></span><span class="icon quick-chevron" data-icon="chevron-right"></span></button>
                    <button class="quick-action" data-quick-tab="database" type="button"><span class="quick-icon green"><span class="icon" data-icon="table-2"></span></span><span><strong>Открыть базу данных</strong><small>PostgreSQL · cashdesk</small></span><span class="icon quick-chevron" data-icon="chevron-right"></span></button>
                    <button class="quick-action" data-quick-tab="hardware" type="button"><span class="quick-icon amber"><span class="icon" data-icon="scan-line"></span></span><span><strong>Сканировать оборудование</strong><small>Последняя проверка 2 ч назад</small></span><span class="icon quick-chevron" data-icon="chevron-right"></span></button>
                  </div>
                </article>

                <article class="panel system-panel">
                  <div class="panel-header"><div><p class="eyebrow">Мониторинг</p><h3>Ресурсы системы</h3></div><span class="updated-label"><span class="live-dot"></span> Сейчас</span></div>
                  <div class="resource-layout">
                    <div class="resource-summary"><div class="ring-chart"><svg viewBox="0 0 120 120" aria-hidden="true"><circle class="ring-bg" cx="60" cy="60" r="48"></circle><circle class="ring-value" cx="60" cy="60" r="48"></circle></svg><span><strong>39</strong><small>% RAM</small></span></div><div class="resource-caption"><strong>Умеренная нагрузка</strong><span>Система работает стабильно</span></div></div>
                    <div class="resource-bars">
                      <div class="resource-row"><span><i class="resource-dot blue-dot"></i>CPU</span><strong>42%</strong><div class="progress-track"><span class="progress-fill blue-fill" style="width:42%"></span></div></div>
                      <div class="resource-row"><span><i class="resource-dot violet-dot"></i>Память</span><strong>39%</strong><div class="progress-track"><span class="progress-fill violet-fill" style="width:39%"></span></div></div>
                      <div class="resource-row"><span><i class="resource-dot amber-dot"></i>Диск</span><strong>64%</strong><div class="progress-track"><span class="progress-fill amber-fill" style="width:64%"></span></div></div>
                    </div>
                  </div>
                </article>

                <article class="panel activity-panel">
                  <div class="panel-header"><div><p class="eyebrow">История</p><h3>Последние события</h3></div><button class="panel-link compact-link" id="openActivity" type="button">Весь журнал <span class="icon" data-icon="arrow-up-right"></span></button></div>
                  <div class="timeline">
                    <div class="timeline-item"><span class="timeline-marker green-marker"><span class="icon" data-icon="check"></span></span><div><strong>Проверка системы завершена</strong><span>Все 18 компонентов в норме</span></div><time>14:32</time></div>
                    <div class="timeline-item"><span class="timeline-marker blue-marker"><span class="icon" data-icon="upload-cloud"></span></span><div><strong>Обновлён файл конфигурации</strong><span>/opt/cashdesk/config.yml</span></div><time>14:19</time></div>
                    <div class="timeline-item"><span class="timeline-marker violet-marker"><span class="icon" data-icon="database"></span></span><div><strong>Выполнен SQL-запрос</strong><span>SELECT · 24 строки · 0.12 сек</span></div><time>13:47</time></div>
                    <div class="timeline-item"><span class="timeline-marker amber-marker"><span class="icon" data-icon="rotate-cw"></span></span><div><strong>Туннель переподключён</strong><span>5432 → jump-prod-01</span></div><time>12:08</time></div>
                  </div>
                </article>
              </div>
            </section>

            <section class="tab-panel" data-panel="terminal">
              <div class="module-toolbar"><div><p class="eyebrow accent-label">SSH-сессия</p><h2>Терминал</h2><p class="module-description">Подключение к <strong id="terminalHost">10.24.8.41</strong> через защищённый канал.</p></div><div class="toolbar-actions"><span class="connection-pill"><span class="status-dot online"></span> SSH подключён</span><button class="secondary-button" id="clearTerminal" type="button"><span class="icon" data-icon="eraser"></span> Очистить</button></div></div>
              <div class="terminal-window">
                <div class="terminal-titlebar"><div class="terminal-dots"><i></i><i></i><i></i></div><span>alexey@cashdesk-01: ~</span><div class="terminal-title-actions"><span class="terminal-secure"><span class="icon" data-icon="lock-keyhole"></span> защищено</span><span class="icon" data-icon="maximize-2"></span></div></div>
                <div class="terminal-output" id="terminalOutput"><div><span class="terminal-muted">Касса Control SSH gateway · OpenSSH_8.9p1</span></div><div>Последнее подключение: сегодня в 13:50 с 10.24.0.12</div><div class="terminal-gap"></div><div><span class="terminal-green">alexey@cashdesk-01</span><span class="terminal-muted">:</span><span class="terminal-blue">~</span><span class="terminal-muted">$</span> <span>systemctl status cashdesk --no-pager</span></div><div class="terminal-green">● cashdesk.service — CashDesk POS service</div><div>     Loaded: loaded (/etc/systemd/system/cashdesk.service; enabled)</div><div>     Active: <span class="terminal-green">active (running)</span> since Wed 2026-09-05 08:14:22 UTC</div><div>   Main PID: 1842 (cashdesk)</div><div class="terminal-gap"></div><div><span class="terminal-green">alexey@cashdesk-01</span><span class="terminal-muted">:</span><span class="terminal-blue">~</span><span class="terminal-muted">$</span> <span class="terminal-caret">▊</span></div></div>
                <form class="terminal-input-row" id="terminalForm"><span class="terminal-green">alexey@cashdesk-01</span><span class="terminal-muted">:</span><span class="terminal-blue">~</span><span class="terminal-muted">$</span><input id="terminalInput" type="text" autocomplete="off" spellcheck="false" aria-label="Команда терминала" placeholder="Введите команду…"><button type="submit" aria-label="Выполнить команду"><span class="icon" data-icon="corner-down-left"></span></button></form>
              </div>
              <div class="terminal-footer"><span><span class="icon" data-icon="info"></span> Ctrl + L — очистить экран</span><span><span class="icon" data-icon="wifi"></span> Задержка 28 ms</span><span class="terminal-encoding">UTF-8</span></div>
            </section>

            <section class="tab-panel" data-panel="files">
              <div class="module-toolbar"><div><p class="eyebrow accent-label">Удалённая файловая система</p><h2>Файлы</h2><p class="module-description">SFTP подключён. Изменения синхронизируются после сохранения.</p></div><div class="toolbar-actions"><button class="secondary-button" id="uploadFile" type="button"><span class="icon" data-icon="upload"></span> Загрузить</button><button class="primary-button compact" id="newFile" type="button"><span class="icon" data-icon="file-plus-2"></span> Новый файл</button></div></div>
              <div class="file-workspace">
                <div class="file-toolbar"><div class="file-path"><span class="icon" data-icon="hard-drive"></span><button type="button">/</button><span class="icon" data-icon="chevron-right"></span><button type="button">opt</button><span class="icon" data-icon="chevron-right"></span><strong>cashdesk</strong></div><div class="file-toolbar-actions"><button class="icon-button small" type="button" aria-label="Назад"><span class="icon" data-icon="arrow-left"></span></button><button class="icon-button small" type="button" aria-label="Вперёд"><span class="icon" data-icon="arrow-right"></span></button><span class="toolbar-separator"></span><button class="icon-button small" type="button" aria-label="Обновить"><span class="icon" data-icon="refresh-cw"></span></button><button class="icon-button small" type="button" aria-label="Вид списка"><span class="icon" data-icon="list"></span></button></div></div>
                <div class="file-columns"><div class="file-tree"><div class="file-tree-heading"><span>Папки</span><span>3</span></div><button class="tree-item active" type="button"><span class="icon" data-icon="folder-open"></span>cashdesk</button><button class="tree-item indent" type="button"><span class="icon" data-icon="folder"></span>config</button><button class="tree-item indent" type="button"><span class="icon" data-icon="folder"></span>logs</button><button class="tree-item indent" type="button"><span class="icon" data-icon="folder"></span>scripts</button><button class="tree-item" type="button"><span class="icon" data-icon="folder"></span>backups</button><div class="storage-card"><div class="storage-top"><span><span class="icon" data-icon="hard-drive"></span> Диск</span><strong>64%</strong></div><div class="progress-track"><span class="progress-fill amber-fill" style="width:64%"></span></div><small>128 GB из 200 GB</small></div></div><div class="file-list"><div class="file-list-heading"><span class="file-name-col">Имя</span><span>Размер</span><span>Изменён</span><span></span></div><button class="file-row" type="button"><span class="file-name"><span class="file-icon yaml">Y</span><strong>config.yml</strong></span><span>4.8 KB</span><span>Сегодня, 14:19</span><span class="icon" data-icon="more-horizontal"></span></button><button class="file-row" type="button"><span class="file-name"><span class="file-icon shell">$</span><strong>restart.sh</strong></span><span>1.2 KB</span><span>Вчера, 18:42</span><span class="icon" data-icon="more-horizontal"></span></button><button class="file-row" type="button"><span class="file-name"><span class="file-icon json">{ }</span><strong>devices.json</strong></span><span>18.4 KB</span><span>Вчера, 16:10</span><span class="icon" data-icon="more-horizontal"></span></button><button class="file-row" type="button"><span class="file-name"><span class="file-icon log">≡</span><strong>cashdesk.log</strong></span><span>2.4 MB</span><span>Сегод