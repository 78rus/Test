  styles.css: |
    :root {
      color-scheme: dark;
      --bg: #0b0e13;
      --bg-soft: #10141b;
      --sidebar: #11151d;
      --panel: #151a23;
      --panel-raised: #1a202b;
      --panel-hover: #202735;
      --border: #252d3a;
      --border-soft: rgba(151, 165, 191, .12);
      --text: #f3f5f9;
      --text-muted: #919caf;
      --text-dim: #657084;
      --blue: #6c8cff;
      --blue-bright: #8da5ff;
      --violet: #a58af7;
      --green: #55d6a2;
      --amber: #f2b767;
      --red: #ed7786;
      --cyan: #66c7dd;
      --radius: 12px;
      --sidebar-width: 268px;
      --shadow: 0 18px 45px rgba(0, 0, 0, .18);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
      line-height: 1.45;
      letter-spacing: -.01em;
    }
    button, input, textarea, select { font: inherit; }
    button { color: inherit; }
    button:not(:disabled), .file-row, .tree-item { cursor: pointer; }
    button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {
      outline: 2px solid var(--blue);
      outline-offset: 2px;
    }
    .icon {
      width: 16px;
      height: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
    }
    .icon svg { width: 100%; height: 100%; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

    .app-shell { min-height: 100vh; display: flex; background: radial-gradient(circle at 75% -10%, rgba(65, 82, 144, .09), transparent 35%), var(--bg); }
    .sidebar {
      width: var(--sidebar-width);
      min-width: var(--sidebar-width);
      min-height: 100vh;
      padding: 22px 14px 14px;
      display: flex;
      flex-direction: column;
      background: linear-gradient(180deg, #131821 0%, #10141b 100%);
      border-right: 1px solid var(--border-soft);
      position: relative;
      z-index: 5;
    }
    .brand-row { height: 38px; display: flex; align-items: center; gap: 10px; padding: 0 8px; }
    .brand-mark { width: 25px; height: 27px; display: flex; align-items: end; gap: 3px; transform: skewY(-18deg); }
    .brand-mark span { display: block; width: 6px; border-radius: 2px 2px 1px 1px; background: var(--blue); box-shadow: 0 4px 15px rgba(108, 140, 255, .3); }
    .brand-mark span:nth-child(1) { height: 14px; opacity: .6; }
    .brand-mark span:nth-child(2) { height: 22px; }
    .brand-mark span:nth-child(3) { height: 27px; background: var(--violet); }
    .brand-lockup { display: flex; flex-direction: column; line-height: 1; gap: 4px; }
    .brand-lockup strong { font-size: 14px; letter-spacing: .14em; font-weight: 760; }
    .brand-lockup span { color: var(--text-dim); font-size: 8px; letter-spacing: .34em; font-weight: 700; }
    .sidebar-close { margin-left: auto; color: var(--text-dim); }
    .sidebar-close:hover { color: var(--text); background: var(--panel-hover); }
    .icon-button {
      width: 34px;
      height: 34px;
      border: 1px solid transparent;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      border-radius: 8px;
      background: transparent;
