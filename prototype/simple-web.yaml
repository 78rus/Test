    .compact-link { padding: 0; font-size: 9px; }
    .timeline { display: flex; flex-direction: column; }
    .timeline-item { min-height: 46px; display: flex; align-items: flex-start; gap: 9px; position: relative; }
    .timeline-item:not(:last-child)::after { content: ""; position: absolute; left: 11px; top: 25px; bottom: 0; border-left: 1px dashed #303a4a; }
    .timeline-marker { width: 23px; height: 23px; display: grid; place-items: center; border-radius: 7px; z-index: 1; }
    .timeline-marker .icon { width: 12px; height: 12px; }
    .green-marker { color: var(--green); background: rgba(85,214,162,.1); }
    .blue-marker { color: var(--blue-bright); background: rgba(108,140,255,.1); }
    .violet-marker { color: var(--violet); background: rgba(165,138,247,.1); }
    .amber-marker { color: var(--amber); background: rgba(242,183,103,.1); }
    .timeline-item > div { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 3px; padding-top: 1px; }
    .timeline-item strong { overflow: hidden; color: #d8dee8; font-size: 10px; font-weight: 620; white-space: nowrap; text-overflow: ellipsis; }
    .timeline-item span:not(.icon) { overflow: hidden; color: var(--text-dim); font-size: 9px; white-space: nowrap; text-overflow: ellipsis; }
    .timeline-item time { padding-top: 2px; color: var(--text-dim); font-size: 9px; }

    /* Shared module layouts */
    .module-toolbar { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 22px; }
    .module-toolbar h2 { margin-top: 6px; }
    .toolbar-actions { display: flex; align-items: center; gap: 8px; }
    .toolbar-actions .connection-pill { margin-right: 2px; }
    .module-dot { margin: 0 5px; color: #4c5a70; }

    /* Terminal */
    .terminal-window { overflow: hidden; border: 1px solid #283342; border-radius: 12px; background: #0b1016; box-shadow: var(--shadow); }
    .terminal-titlebar { height: 43px; padding: 0 15px; display: flex; align-items: center; gap: 13px; color: #8290a7; border-bottom: 1px solid #202b39; background: #151c26; font-family: "SFMono-Regular", Consolas, monospace; font-size: 10px; }
    .terminal-dots { display: flex; gap: 5px; }
    .terminal-dots i { width: 8px; height: 8px; border-radius: 50%; background: #e26e77; }
    .terminal-dots i:nth-child(2) { background: #d2a25c; }
    .terminal-dots i:nth-child(3) { background: #5cc797; }
    .terminal-title-actions { margin-left: auto; display: flex; align-items: center; gap: 15px; color: #68768c; }
    .terminal-secure { display: inline-flex; align-items: center; gap: 5px; color: #62b895; font-family: var(--font, inherit); font-size: 9px; }
    .terminal-secure .icon { width: 12px; height: 12px; }
    .terminal-output { min-height: 430px; padding: 24px 26px 10px; color: #aeb9c7; font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; font-size: 11px; line-height: 1.85; white-space: pre-wrap; }
    .terminal-muted { color: #64738a; }
    .terminal-green { color: #55d6a2; }
    .terminal-blue { color: #8ba1ff; }
    .terminal-gap { height: 11px; }
    .terminal-caret { color: var(--blue-bright); animation: blink 1.1s step-end infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .terminal-input-row { min-height: 48px; padding: 7px 18px 13px 26px; display: flex; align-items: center; gap: 5px; color: #aeb9c7; font-family: "SFMono-Regular", Consolas, monospace; font-size: 11px; }
    .terminal-input-row input { min-width: 0; flex: 1; padding: 5px 4px; border: 0; outline: 0; color: #dce6f0; background: transparent; font-family: inherit; font-size: inherit; }
    .terminal-input-row input::placeholder { color: #526177; }
    .terminal-input-row button { width: 25px; height: 25px; border: 0; display: grid; place-items: center; border-radius: 5px; color: var(--blue-bright); background: rgba(108,140,255,.1); }
    .terminal-input-row button:hover { background: rgba(108,140,255,.2); }
    .terminal-input-row button .icon { width: 13px; height: 13px; }
    .terminal-footer { padding: 12px 3px 0; display: flex; gap: 22px; align-items: center; color: var(--text-dim); font-size: 9px; }
    .terminal-footer > span { display: inline-flex; align-items: center; gap: 5px; }
    .terminal-footer .icon { width: 12px; height: 12px; }
    .terminal-encoding { margin-left: auto; }

    /* Files */
    .file-workspace { overflow: hidden; border: 1px solid var(--border); border-radius: 11px; background: var(--panel); box-shadow: var(--shadow); }
    .file-toolbar { min-height: 50px; padding: 8px 12px; display: flex; align-items: center; justify-content: space-between; gap: 15px; border-bottom: 1px solid var(--border); background: #171d26; }
    .file-path { min-width: 0; display: flex; align-items: center; gap: 7px; color: var(--text-dim); font-size: 11px; }
    .file-path > .icon:first-child { color: var(--amber); }
    .file-path .icon { width: 13px; height: 13px; }
    .file-path button { border: 0; padding: 3px 0; color: var(--text-muted); background: transparent; }
    .file-path button:hover { color: var(--blue-bright); }
    .file-path strong { color: var(--text); font-weight: 620; }
    .file-toolbar-actions { display: flex; align-items: center; gap: 4px; }
    .toolbar-separator { width: 1px; height: 20px; margin: 0 5px; background: var(--border); }
    .file-columns { min-height: 510px; display: grid; grid-template-columns: 205px 1fr; }
    .file-tree { padding: 17px 10px 12px; border-right: 1px solid var(--border); background: #131821; }
    .file-tree-heading { padding: 0 8px 11px; display: flex; justify-content: space-between; color: var(--text-dim); font-size: 9px; text-transform: uppercase; letter-spacing: .11em; }
    .file-tree-heading span:last-child { color: #58667a; }
    .tree-item { width: 100%; height: 33px; border: 0; border-radius: 6px; padding: 0 8px; display: flex; align-items: center; gap: 8px; color: var(--text-muted); background: transparent; text-align: left; font-size: 10px; }
    .tree-item:hover { color: var(--text); background: rgba(255,255,255,.04); }
    .tree-item.active { color: #c1ccff; background: rgba(108,140,255,.12); }
    .tree-item .icon { width: 14px; height: 14px; color: var(--text-dim); }
    .tree-item.active .icon { color: var(--blue-bright); }
    .tree-item.indent { padding-left: 28px; }
    .storage-card { margin: 25px 6px 0; padding: 11px 10px; border: 1px solid var(--border-soft); border-radius: 8px; background: rgba(255,255,255,.025); }
    .storage-top { display: flex; justify-content: space-between; margin-bottom: 9px; color: var(--text-muted); font-size: 9px; }
    .storage-top span { display: flex; align-items: center; gap: 5px; }
    .storage-top .icon { width: 12px; height: 12px; color: var(--amber); }
    .storage-top strong { color: var(--amber); font-weight: 650; }
    .storage-card small { display: block; margin-top: 7px; color: var(--text-dim); font-size: 8px; }
    .file-list { min-width: 0; padding: 0 4px; }
    .file-list-heading, .file-row { min-width: 620px; display: grid; grid-template-columns: minmax(235px, 1.8fr) minmax(85px, .55fr) minmax(150px, .8fr) 25px; column-gap: 12px; align-items: center; }
    .file-list-heading { height: 43px; padding: 0 15px; color: var(--text-dim); border-bottom: 1px solid var(--border-soft); font-size: 9px; }
    .file-name-col { color: var(--text-muted); }
    .file-row { width: calc(100% - 8px); min-height: 56px; margin: 0 4px; padding: 0 11px; border: 0; border-bottom: 1px solid var(--border-soft); color: var(--text-dim); background: transparent; text-align: left; font-size: 10px; transition: background .15s; }
    .file-row:hover { background: rgba(108,140,255,.06); }
    .file-name { min-width: 0; display: flex; align-items: center; gap: 9px; }
    .file-name strong { overflow: hidden; color: #dbe1eb; font-weight: 580; white-space: nowrap; text-overflow: ellipsis; }
    .file-icon { width: 25px; height: 28px; display: grid; place-items: center; border-radius: 6px; font-family: "SFMono-Regular", monospace; font-size: 9px; font-weight: 800; }
    .file-icon.yaml { color: #9ab0ff; background: rgba(108,140,255,.14); }
    .file-icon.shell { color: #9be4c4; background: rgba(85,214,162,.12); }
    .file-icon.json { color: #ffd18a; background: rgba(242,183,103,.13); }
    .file-icon.log { color: #c6a9ff; background: rgba(165,138,247,.12); }
    .file-icon.text { color: #91d7e5; background: rgba(102,199,221,.12); }
    .file-row > .icon { width: 15px; color: var(--text-dim); }
    .file-list-footer { min-width: 620px; padding: 14px 15px; display: flex; justify-content: space-between; color: var(--text-dim); font-size: 9px; }
    .file-list-footer span:last-child { display: flex; align-items: center; gap: 6px; color: #79928f; }

    /* Database */
    .database-workspace { min-height: 560px; display: grid; grid-template-columns: 205px minmax(0, 1fr); overflow: hidden; border: 1px solid var(--border); border-radius: 11px; background: var(--panel); box-shadow: var(--shadow); }
    .schema-sidebar { padding: 15px 9px; border-right: 1px solid var(--border); background: #131821; }
    .schema-head { display: flex; align-items: center; justify-content: space-between; padding: 0 7px 13px; color: var(--text-muted); font-size: 10px; }
    .schema-search { height: 29px; margin: 0 4px 18px; padding: 0 8px; display: flex; align-items: center; gap: 6px; border: 1px solid var(--border); border-radius: 6px; color: var(--text-dim); background: rgba(255,255,255,.02); }
    .schema-search .icon { width: 12px; height: 12px; }
    .schema-search input { width: 100%; min-width: 0; border: 0; outline: 0; color: var(--text-muted); background: transparent; font-size: 9px; }
    .schema-search input::placeholder { color: #536177; }
    .schema-group > div:first-child { height: 28px; padding: 0 7px; display: flex; align-items: center; gap: 6px; color: var(--text-muted); }
    .schema-group > div:first-child > .icon:first-child { width: 12px; height: 12px; }
    .schema-db { width: 14px; height: 14px; color: var(--green); }
    .schema-group strong { font-size: 10px; font-weight: 650; }
    .schema-group small { margin-left: auto; color: var(--text-dim); font-size: 8px; }
    .schema-table { width: 100%; height: 32px; border: 0; border-radius: 6px; padding: 0 8px 0 26px; display: flex; align-items: center; gap: 7px; color: var(--text-dim); background: transparent; font-size: 10px; text-align: left; }
    .schema-table:hover { color: var(--text-muted); background: rgba(255,255,255,.04); }
    .schema-table.active { color: #c3ceff; background: rgba(108,140,255,.12); }
    .schema-table .icon { width: 13px; height: 13px; }
    .schema-table em { margin-left: auto; color: #59667a; font-size: 8px; font-style: normal; }
    .query-area { min-width: 0; display: flex; flex-direction: column; background: #11161d; }
    .query-editor { min-height: 257px; border-bottom: 1px solid var(--border); }
    .query-toolbar { height: 43px; padding: 0 12px; display: flex; align-items: center; gap: 4px; border-bottom: 1px solid var(--border-soft); background: #171d26; }
    .query-tab { height: 27px; padding: 0 10px; display: inline-flex; align-items: center; gap: 7px; border-radius: 5px; color: var(--text-muted); background: rgba(108,140,255,.1); font-size: 10px; }
    .query-tab .icon { width: 12px; height: 12px; color: var(--blue-bright); }
    .query-spacer { flex: 1; }
    .query-hint { margin-right: 8px; color: var(--text-dim); font-size: 9px; }
    .run-query { height: 27px; padding: 0 9px; display: inline-flex; align-items: center; gap: 6px; border: 0; border-radius: 5px; color: #0e1724; background: var(--green); font-size: 9px; font-weight: 700; }
    .run-query:hover { background: #75e4b6; }
    .run-query .icon { width: 11px; height: 11px; }
    .code-editor { min-height: 213px; display: grid; grid-template-columns: 44px 1fr; padding: 17px 0; }
    .line-numbers { padding-right: 12px; color: #4b596d; border-right: 1px solid rgba(255,255,255,.035); font: 11px/1.85 "SFMono-Regular", Consolas, monospace; text-align: right; user-select: none; }
    .code-editor textarea { resize: none; width: 100%; height: 175px; padding: 0 17px; border: 0; outline: 0; color: #b9c8fa; background: transparent; font: 11px/1.85 "SFMono-Regular", Consolas, monospace; }
    .results-panel { min-width: 0; flex: 1; }
    .results-header { min-height: 67px; padding: 13px 17px; display: flex; align-items: center; justify-content: space-between; gap: 15px; border-bottom: 1px solid var(--border-soft); }
    .results-header strong { display: block; margin-top: 5px; color: #dfe5ed; font-size: 11px; font-weight: 620; }
    .results-header strong span { color: var(--text-dim); font-weight: 450; }
    .query-duration { display: inline-flex; align-items: center; gap: 7px; color: #80ae9c; font-size: 9px; }
    .data-table-wrap { overflow-x: auto; }
    .data-table { width: 100%; min-width: 640px; border-collapse: collapse; color: var(--text-muted); font-size: 10px; }
    .data-table th { height: 36px; padding: 0 17px; color: var(--text-dim); border-bottom: 1px solid var(--border-soft); font-size: 9px; font-weight: 600; text-align: left; }
    .data-table td { height: 46px; padding: 0 17px; border-bottom: 1px solid var(--border-soft); white-space: nowrap; }
    .data-table tbody tr:hover { background: rgba(108,140,255,.04); }
    .mono { color: #aebcff; font-family: "SFMono-Regular", monospace; font-size: 9px; }

    /* VNC */
    .vnc-layout { display: grid; grid-template-columns: minmax(0, 1fr) 230px; gap: 13px; align-items: start; }
    .vnc-screen { min-width: 0; overflow: hidden; border: 1px solid #344053; border-radius: 11px; background: #e9edf2; box-shadow: var(--shadow); }
    .vnc-topbar { height: 40px; padding: 0 16px; display: flex; align-items: center; color: #dce4ed; background: #1a202a; font-size: 10px; }
    .vnc-brand { display: inline-flex; align-items: center; gap: 7px; font-size: 10px; letter-spacing: .13em; font-weight: 800; }
    .brand-mini-mark { height: 15px; display: flex; align-items: end; gap: 2px; transform: skewY(-18deg); }
    .brand-mini-mark i { display: block; width: 3px; border-radius: 1px; background: #8499ff; }
    .brand-mini-mark i:nth-child(1) { height: 8px; opacity: .7; }
    .brand-mini-mark i:nth-child(2) { height: 12px; }
    .brand-mini-mark i:nth-child(3) { height: 15px; background: #b091ff; }
    .vnc-terminal-name { margin-left: auto; margin-right: 26px; color: #8994a7; }
    .vnc-online-dot { display: inline-block; width: 5px; height: 5px; margin-left: 5px; vertical-align: middle; border-radius: 50%; background: var(--green); }
    .vnc-clock { color: #d2d9e4; font-family: "SFMono-Regular", monospace; }
    .vnc-body { min-height: 477px; display: flex; color: #253142; font-family: Inter, sans-serif; background: #f3f5f7; }
    .pos-sidebar { width: 73px; padding: 17px 9px; display: flex; flex-direction: column; align-items: center; gap: 11px; color: #8290a4; background: #252e3b; }
    .pos-side-logo { width: 30px; height: 30px; margin-bottom: 9px; display: grid; place-items: center; border-radius: 8px; color: #fff; background: #586de0; font-size: 10px; font-weight: 800; }
    .pos-side-item { width: 55px; min-height: 50px; padding: 6px 2px; display: flex; align-items: center; flex-direction: column; justify-content: center; gap: 4px; border-radius: 7px; font-size: 8px; }
    .pos-side-item .icon { width: 16px; height: 16px; }
    .pos-side-item.active { color: #dbe3ff; background: #354578; }
    .pos-content { min-width: 0; flex: 1; padding: 21px 23px; }
    .pos-heading { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 20px; }
    .pos-heading > div { display: flex; flex-direction: column; gap: 4px; }
    .pos-kicker { color: #7b8798; font-size: 9px; }
    .pos-heading strong { font-size: 17px; letter-spacing: -.03em; }
    .pos-cashier { display: inline-flex; align-items: center; gap: 7px; color: #708094; font-size: 9px; }
    .avatar.mini { width: 21px; height: 21px; color: #4b5b9f; background: #d9e0ff; font-size: 7px; }
    .pos-main { display: grid; grid-template-columns: minmax(0, 1.18fr) minmax(200px, .82fr); gap: 17px; }
    .pos-product-search { height: 35px; margin-bottom: 14px; padding: 0 10px; display: flex; align-items: center; gap: 8px; border: 1px solid #dde2e8; border-radius: 7px; color: #9aa5b3; background: #fff; font-size: 9px; }
    .pos-product-search .icon { width: 13px; height: 13px; }
    .pos-product-search kbd { margin-left: auto; padding: 3px 5px; border: 1px solid #e0e5eb; border-radius: 4px; color: #7f8997; background: #f6f7f9; font-size: 8px; }
    .product-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; }
    .product-tile { min-height: 105px; padding: 11px; display: flex; flex-direction: column; justify-content: flex-end; gap: 5px; border: 1px solid #e0e5eb; border-radius: 8px; background: #fff; }
    .product-tile:hover { border-color: #aab8f5; box-shadow: 0 4px 14px rgba(85,100,150,.1); }
    .product-color { width: 30px; height: 30px; margin-bottom: auto; display: block; border-radius: 7px; }
    .product-color.coral, .cart-thumb.coral { background: #f5b3a8; }
    .product-color.blue, .cart-thumb.blue { background: #aab9ef; }
    .product-color.yellow { background: #f1d590; }
    .product-color.violet, .cart-thumb.violet { background: #c4b4e9; }
    .product-color.mint { background: #a8d9c8; }
    .product-color.orange { background: #edbd84; }
    .product-tile strong { overflow: hidden; color: #425064; font-size: 9px; font-weight: 650; white-space: nowrap; text-overflow: ellipsis; }
    .product-tile small { color: #7b8798; font-size: 9px; }
    .pos-cart { min-height: 342px; padding: 15px; display: flex; flex-direction: column; border: 1px solid #e1e5ea; border-radius: 9px; background: #fff; box-shadow: 0 5px 16px rgba(33,44,63,.04); }
    .cart-head { display: flex; justify-content: space-between; padding-bottom: 10px; border-bottom: 1px solid #edf0f3; color: #9aa5b3; font-size: 9px; }
    .cart-head strong { color: #445267; font-size: 11px; }
    .cart-item { min-height: 48px; padding: 8px 0; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #f0f2f5; color: #556276; font-size: 9px; }
    .cart-thumb { width: 23px; height: 23px; border-radius: 5px; flex: 0 0 auto; }
    .cart-item > span:nth-child(2) { flex: 1; display: flex; flex-direction: column; gap: 3px; }
    .cart-item small { color: #a2aab5; font-size: 8px; }
    .cart-item > strong { color: #506076; font-size: 9px; }
    .cart-total { margin-top: auto; padding: 15px 0 13px; display: flex; justify-content: space-between; color: #778497; font-size: 10px; }
    .cart-total strong { color: #334154; font-size: 16px; }
    .cart-pay { height: 34px; border: 0; border-radius: 6px; display: flex; align-items: center; justify-content: center; gap: 8px; color: #fff; background: #657ce4; font-size: 9px; font-weight: 650; }
    .cart-pay:hover { background: #526bd8; }
    .cart-pay .icon { width: 13px; height: 13px; }
    .vnc-controls { min-height: 42px; padding: 0 13px; display: flex; align-items: center; gap: 20px; color: var(--text-dim); background: #171e28; font-size: 9px; }
    .vnc-controls > span { display: inline-flex; align-items: center; gap: 6px; }
    .vnc-controls .icon { width: 13px; height: 13px; }
    .vnc-control-spacer { flex: 1; }
    .vnc-info { padding: 17px; }
    .vnc-info .panel-header { margin-bottom: 20px; }
    .vnc-info-list { display: flex; flex-direction: column; gap: 17px; }
    .vnc-info-list > div { display: flex; flex-direction: column; gap: 4px; }
    .vnc-info-list span { color: var(--text-dim); font-size: 9px; }
    .vnc-info-list strong { display: flex; align-items: center; gap: 6px; color: #cdd5e1; font: 10px "SFMono-Regular", Consolas, monospace; font-weight: 500; }
    .vnc-info-list strong .icon { width: 12px; height: 12px; color: var(--green); }
    .quality { color: var(--green) !important; font-family: inherit !important; }
    .quality i { width: 4px; height: 12px; display: inline-block; border-radius: 2px; background: var(--green); }
    .quality i:nth-child(4), .quality i:nth-child(5) { opacity: .35; }

    /* Hardware */
    .hardware-grid { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(300px, .8fr); gap: 13px; }
    .hardware-grid > .panel { min-height: 222px; }
    .detection-card { grid-column: span 2; padding: 20px; }
    .detection-hero { display: flex; align-items: center; gap: 14px; }
    .detection-icon { width: 51px; height: 51px; display: grid; place-items: center; border-radius: 13px; color: var(--blue-bright); background: linear-gradient(135deg, rgba(108,140,255,.2), rgba(165,138,247,.16)); }
    .detection-icon .icon { width: 25px; height: 25px; }
    .detection-hero h3 { margin-top: 5px; font-size: 17px; }
    .detection-hero p:not(.eyebrow) { margin: 6px 0 0; color: var(--text-dim); font-size: 10px; }
    .detection-hero p strong { color: var(--green); font-weight: 650; }
    .detected-pill { height: 24px; margin-left: auto; padding: 0 9px; display: inline-flex; align-items: center; gap: 7px; border-radius: 20px; color: #8ee5c1; background: rgba(85,214,162,.08); font-size: 9px; font-weight: 650; }
    .detection-tags { display: flex; flex-wrap: wrap; gap: 7px; margin: 20px 0 15px 65px; }
    .detection-tags span { padding: 5px 8px; border: 1px solid var(--border); border-radius: 5px; color: var(--text-muted); background: rgba(255,255,255,.025); font-size: 9px; }
    .detection-note { margin-left: 65px; padding: 10px 12px; display: flex; align-items: center; gap: 8px; border: 1px solid rgba(108,140,255,.15); border-radius: 7px; color: #8998bd; background: rgba(108,140,255,.06); font-size: 9px; }
    .detection-note .icon { width: 14px; height: 14px; color: var(--blue-bright); }
    .detection-note strong { color: #b2c0f2; font-family: "SFMono-Regular", monospace; font-weight: 500; }
    .hardware-list-card, .software-card { padding-bottom: 9px; }
    .hardware-items, .software-list { display: flex; flex-direction: column; }
    .hardware-items > div, .software-list > div { min-height: 49px; display: flex; align-items: center; gap: 9px; border-bottom: 1px solid var(--border-soft); }
    .hardware-items > div:last-child, .software-list > div:last-child { border-bottom: 0; }
    .hardware-icon { width: 27px; height: 27px; display: grid; place-items: center; border-radius: 7px; }
    .hardware-icon .icon { width: 14px; height: 14px; }
    .hardware-icon.scanner { color: var(--blue-bright); background: rgba(108,140,255,.1); }
    .hardware-icon.printer { color: var(--violet); background: rgba(165,138,247,.1); }
    .hardware-icon.scale { color: var(--amber); background: rgba(242,183,103,.1); }
    .hardware-icon.display { color: var(--green); background: rgba(85,214,162,.1); }
    .hardware-items > div > span:nth-child(2), .software-list > div > span:nth-child(2) { min-width: 0; display: flex; flex-direction: column; gap: 3px; flex: 1; }
    .hardware-items strong, .software-list strong { overflow: hidden; color: #dbe1ea; font-size: 10px; font-weight: 620; white-space: nowrap; text-overflow: ellipsis; }
    .hardware-items small, .software-list small { overflow: hidden; color: var(--text-dim); font-size: 9px; white-space: nowrap; text-overflow: ellipsis; }
    .software-list .service-icon { width: 27px; height: 27px; }
    .software-list .status-dot { margin-right: 7px; }
    .network-card { padding: 18px; }
    .network-main { min-height: 48px; display: flex; align-items: center; gap: 10px; }
    .network-icon { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 8px; color: var(--blue-bright); background: rgba(108,140,255,.1); }
    .network-icon .icon { width: 17px; height: 17px; }
    .network-main > div:nth-child(2) { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
    .network-main strong { color: #dbe1ea; font-size: 10px; font-weight: 620; }
    .network-main > div:nth-child(2) span { color: var(--text-dim); font: 8px "SFMono-Regular", Consolas, monospace; }
    .network-traffic { margin-left: auto; display: flex; flex-direction: column; gap: 3px; color: var(--text-dim); font: 8px "SFMono-Regular", Consolas, monospace; text-align: right; }
    .network-chart { height: 100px; margin-top: 14px; padding-top: 7px; border-top: 1px solid var(--border-soft); }
    .network-chart svg { width: 100%; height: 72px; overflow: visible; }
    .network-area { fill: url(#networkFill); }
    .network-line { fill: none; stroke: var(--blue); stroke-width: 1.5; vector-effect: non-scaling-stroke; }
    .network-chart > div { display: flex; justify-content: space-between; color: #566277; font-size: 8px; }

    /* Modal and notifications */
    .toast-stack { position: fixed; right: 24px; bottom: 22px; z-index: 30; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; pointer-events: none; }
    .toast { min-width: 260px; max-width: 360px; padding: 12px 14px; display: flex; align-items: center; gap: 9px; border: 1px solid var(--border); border-radius: 9px; color: var(--text-muted); background: #1b222d; box-shadow: 0 15px 40px rgba(0,0,0,.35); font-size: 10px; animation: toast-in .25s ease both; }
    .toast .icon { width: 16px; height: 16px; color: var(--green); }
    .toast.warning .icon { color: var(--amber); }
    .toast strong { color: var(--text); font-weight: 650; }
    @keyframes toast-in { from { opacity: 0; transform: translateY(8px) scale(.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
    .toast.out { animation: toast-out .25s ease both; }
    @keyframes toast-out { to { opacity: 0; transform: translateY(8px); } }
    .modal-backdrop, .command-palette-backdrop { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 20px; background: rgba(4, 6, 10, .7); backdrop-filter: blur(8px); }
    .modal-backdrop[hidden], .command-palette-backdrop[hidden] { display: none; }
    .modal { width: min(100%, 500px); padding: 23px; border: 1px solid #303b4d; border-radius: 14px; background: #161d28; box-shadow: 0 25px 90px rgba(0,0,0,.5); animation: modal-in .2s ease both; }
    @keyframes modal-in { from { opacity: 0; transform: translateY(8px) scale(.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
    .modal-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 15px; margin-bottom: 24px; }
    .modal-header h2 { margin-top: 7px; }
    .modal-header p:last-child { margin: 0; color: var(--text-dim); font-size: 10px; }
    #connectionForm { display: flex; flex-direction: column; gap: 16px; }
    #connectionForm label { display: flex; flex-direction: column; gap: 7px; color: var(--text-muted); font-size: 10px; font-weight: 600; }
    #connectionForm input, #connectionForm select { height: 38px; padding: 0 10px; border: 1px solid var(--border); border-radius: 7px; outline: 0; color: var(--text); background: #11161e; font-size: 11px; }
    #connectionForm input::placeholder { color: #5c697d; }
    #connectionForm input:focus, #connectionForm select:focus { border-color: rgba(108,140,255,.65); box-shadow: 0 0 0 3px rgba(108,140,255,.1); }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .checkbox-label { flex-direction: row !important; align-items: center; gap: 8px !important; color: var(--text-dim) !important; font-weight: 450 !important; }
    .checkbox-label input { accent-color: var(--blue); }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }
    .command-palette-backdrop { place-items: start center; padding-top: 95px; }
    .command-palette { width: min(100%, 550px); overflow: hidden; border: 1px solid #303b4d; border-radius: 12px; background: #171e29; box-shadow: 0 25px 90px rgba(0,0,0,.5); animation: modal-in .2s ease both; }
    .palette-input { height: 53px; padding: 0 14px; display: flex; align-items: center; gap: 9px; border-bottom: 1px solid var(--border); }
    .palette-input .icon { color: var(--blue-bright); }
    .palette-input input { min-width: 0; flex: 1; border: 0; outline: 0; color: var(--text); background: transparent; font-size: 12px; }
    .palette-input input::placeholder { color: #657287; }
    kbd { padding: 3px 6px; border: 1px solid rgba(138,151,177,.2); border-radius: 4px; color: var(--text-dim); background: rgba(255,255,255,.04); font: 9px "SFMono-Regular", monospace; }
    .palette-items { padding: 7px; }
    .palette-items button { width: 100%; min-height: 52px; padding: 7px 9px; display: flex; align-items: center; gap: 10px; border: 0; border-radius: 7px; color: var(--text); background: transparent; text-align: left; }
    .palette-items button:hover { background: rgba(108,140,255,.1); }
    .palette-items button > span:nth-child(2) { display: flex; flex-direction: column; gap: 3px; flex: 1; }
    .palette-items strong { font-size: 10px; font-weight: 650; }
    .palette-items small { color: var(--text-dim); font-size: 9px; }
    .palette-items button > kbd { color: #8390a5; }
    .palette-footer { padding: 10px 15px; display: flex; gap: 18px; color: var(--text-dim); border-top: 1px solid var(--border-soft); font-size: 9px; }

    .is-spinning { animation: spin .8s linear infinite; }
    button:disabled { opacity: .65; cursor: wait; transform: none !important; }
    .file-row.selected { background: rgba(108,140,255,.09); }
    .file-row.selected .file-name strong { color: #c4ceff; }
    .mobile-menu { display: none; }

    @media (max-width: 1180px) {
      :root { --sidebar-width: 238px; }
      .topbar, .workspace-header, .module-tabs, .content-scroll { padding-left: 25px; padding-right: 25px; }
      .metrics-grid { grid-template-columns: repeat(2, 1fr); }
      .dashboard-grid { grid-template-columns: 1fr; }
      .connections-panel { grid-row: auto; }
      .quick-panel { min-height: 0; }
      .resource-layout { max-width: 680px; }
    }
    @media (max-width: 860px) {
      .sidebar { width: 218px; min-width: 218px; }
      .workspace-header { align-items: flex-start; flex-direction: column; }
      .workspace-actions { width: 100%; }
      .workspace-actions .secondary-button { margin-left: auto; }
      .vnc-layout, .hardware-grid { grid-template-columns: 1fr; }
      .detection-card { grid-column: auto; }
    }
    @media (max-width: 680px) {
      .sidebar { position: fixed; inset: 0 auto 0 0; width: 270px; min-width: 270px; transform: translateX(-100%); transition: transform .25s ease; box-shadow: 15px 0 45px rgba(0,0,0,.4); }
      .sidebar.is-open { transform: translateX(0); }
      .sidebar-close { display: inline-flex; }
      .main-content { width: 100%; }
      .topbar, .workspace-header, .module-tabs, .content-scroll { padding-left: 16px; padding-right: 16px; }
      .topbar { height: 52px; }
      .breadcrumbs span:first-child { display: none; }
      .breadcrumbs .icon { display: none; }
      .environment-label { display: none; }
      .workspace-header { padding-top: 22px; }
      h1 { font-size: 20px; }
      .module-tabs { overflow-x: auto; }
      .module-tab { flex: 0 0 auto; padding: 0 10px; }
      .content-scroll { padding-top: 22px; }
      .overview-intro { align-items: flex-start; flex-direction: column; }
      .overview-intro .ghost-button { align-self: flex-start; }
      .metrics-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
      .metric-card { padding: 13px; min-height: 128px; }
      .metric-value { font-size: 21px; }
      .metric-foot { white-space: normal; }
      .mini-chart { display: none; }
      .quick-actions { grid-template-columns: 1fr; }
      .resource-layout { align-items: flex-start; flex-direction: column; gap: 16px; }
      .resource-summary { min-width: 0; }
      .resource-bars { width: 100%; }
      .workspace-actions { flex-wrap: wrap; }
      .workspace-actions .secondary-button { margin-left: 0; }
      .module-toolbar { flex-direction: column; }
      .toolbar-actions { width: 100%; flex-wrap: wrap; }
      .file-columns, .database-workspace { grid-template-columns: 1fr; }
      .file-tree, .schema-sidebar { display: none; }
      .file-list-heading, .file-row, .file-list-footer { min-width: 540px; }
      .vnc-body { min-height: 490px; }
      .pos-content { padding: 15px; }
      .pos-main { grid-template-columns: 1fr; }
      .pos-cart { min-height: 260px; }
      .pos-sidebar { width: 57px; }
      .pos-side-item { width: 42px; }
      .product-grid { grid-template-columns: repeat(2, 1fr); }
      .detection-tags, .detection-note { margin-left: 0; }
      .detection-hero { align-items: flex-start; flex-wrap: wrap; }
      .detected-pill { margin-left: 0; }
      .terminal-output { min-height: 360px; padding: 18px 15px 10px; font-size: 10px; }
      .terminal-input-row { padding-left: 15px; font-size: 10px; }
      .terminal-footer { flex-wrap: wrap; gap: 8px 16px; }
      .terminal-encoding { margin-left: 0; }
      .toast-stack { right: 12px; left: 12px; bottom: 12px; }
      .toast { min-width: 0; width: 100%; }
      .mobile-menu { display: inline-flex; margin-right: 7px; }
    }
    @media (min-width: 681px) {
      .sidebar-close { display: none; }
    }
    @keyframes spin { to { transform: rotate(360deg); } }
